# Puts books and other big files in the "files" release of this repository, where a file
# can be up to 2 GB and nothing counts against the 1 GB size limit of the site itself.
# The dashboard (assets/js/storage.js) asks for it by adding migrate/requests/<id>.json:
#   {"id": "...", "url": "https://..."}          a link: GitHub's servers download it
#   {"id": "...", "parts": "files/incoming/<id>"} pieces sent from the owner's device
# and reads the answer from migrate/results/<id>.json.
name: Import file
on:
  push:
    branches: [main]
    paths: ['migrate/requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-file
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Make sure the release exists
        run: gh release view files >/dev/null 2>&1 || gh release create files --title "Files" --notes "Books and files of the site, added from the dashboard. Do not delete."
      - name: Import
        shell: python
        run: |
          import glob, http.cookiejar, json, os, re, shutil, subprocess, urllib.parse, urllib.request
          REPO = os.environ['GITHUB_REPOSITORY']
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'}
          MAX = 1900 * 1024 * 1024
          os.makedirs('migrate/results', exist_ok=True)

          def direct(url):
              m = re.search(r'drive\.google\.com/(?:file/d/|open\?id=|uc\?(?:.*&)?id=)([\w-]{10,})', url)
              if m:
                  return f'https://drive.usercontent.google.com/download?id={m.group(1)}&export=download&confirm=t'
              if 'dropbox.com' in url:
                  url = re.sub(r'([?&])dl=0', r'\1dl=1', url)
                  return url if 'dl=1' in url else url + ('&' if '?' in url else '?') + 'dl=1'
              return url

          def next_from_page(base, html):
              m = re.search(r'href="(https://download\d*\.mediafire\.com/[^"]+)"', html)
              if m:
                  return m.group(1)
              form = re.search(r'<form[^>]+action="([^"]*drive\.usercontent\.google\.com/download[^"]*)"(.*?)</form>', html, re.S)
              if form:
                  fields = dict(re.findall(r'name="([^"]+)"\s+value="([^"]*)"', form.group(2)))
                  return form.group(1).replace('&amp;', '&') + '?' + urllib.parse.urlencode(fields)
              return None

          def name_from(headers, url):
              cd = headers.get('Content-Disposition', '')
              m = re.search(r"filename\*=UTF-8''([^;]+)", cd) or re.search(r'filename="?([^";]+)"?', cd)
              if m:
                  return urllib.parse.unquote(m.group(1)).strip()
              return urllib.parse.unquote(urllib.parse.urlparse(url).path.rsplit('/', 1)[-1]) or 'file'

          def download(url, out):
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
              url = direct(url)
              last = None
              for attempt in range(6):
                  try:
                      with opener.open(urllib.request.Request(url, headers=UA), timeout=180) as r:
                          if 'text/html' in r.headers.get('Content-Type', ''):
                              nxt = next_from_page(url, r.read(4_000_000).decode('utf-8', 'ignore'))
                              if not nxt:
                                  raise ValueError('الرابط بيفتح صفحة مش ملف. استخدم رابط تحميل مباشر، أو خلي ملف Google Drive متاح لأي حد معاه الرابط.')
                              url = nxt
                              continue
                          name = name_from(r.headers, url)
                          with open(out, 'wb') as f:
                              shutil.copyfileobj(r, f, 1 << 20)
                          return name
                  except ValueError:
                      raise
                  except Exception as e:
                      last = e
              raise last or ValueError('تعذر تحميل الرابط')

          for path in sorted(glob.glob('migrate/requests/*.json')):
              req = json.load(open(path, encoding='utf-8'))
              rid = str(req.get('id', ''))
              if not re.fullmatch(r'[a-z0-9-]{6,40}', rid):
                  os.remove(path)
                  continue
              tmp = f'/tmp/{rid}'
              os.makedirs(tmp, exist_ok=True)
              data = os.path.join(tmp, 'data')
              parts_dir = None
              try:
                  if req.get('parts'):
                      parts_dir = os.path.normpath(req['parts'])
                      if not parts_dir.startswith('files/incoming/'):
                          raise ValueError('bad parts folder')
                      m = json.load(open(os.path.join(parts_dir, 'manifest.json'), encoding='utf-8'))
                      with open(data, 'wb') as out:
                          for p in m['parts']:
                              with open(os.path.join(parts_dir, os.path.basename(p)), 'rb') as f:
                                  shutil.copyfileobj(f, out, 1 << 20)
                      name = m.get('name') or 'file'
                  else:
                      url = str(req.get('url', ''))
                      if not re.match(r'https?://', url):
                          raise ValueError('الرابط لازم يبدأ بـ https://')
                      got = download(url, data)
                      name = req.get('name') or got
                  size = os.path.getsize(data)
                  if size < 100:
                      raise ValueError('الملف فاضي أو الرابط غلط')
                  if size > MAX:
                      raise ValueError('الملف أكبر من 1.9 جيجا')
                  with open(data, 'rb') as f:
                      head = f.read(512).lower()
                  if b'<html' in head or b'<!doctype html' in head:
                      raise ValueError('الرابط رجّع صفحة ويب مش ملف. اتأكد إن الملف متاح للتحميل لأي حد.')
                  ext = (re.search(r'\.([a-z0-9]{1,8})$', name.lower()) or [None, 'bin'])[1]
                  # GitHub turns non-English letters in a file name into dots, so the saved
                  # file is named after its English words, or after the site.
                  words = re.sub(r'[^a-z0-9]+', '-', name.rsplit('.', 1)[0].lower()).strip('-')[:50]
                  file_name = f"{words if len(words) >= 3 else 'abu-hanin'}-{rid[-6:]}.{ext}"
                  asset = os.path.join(tmp, file_name)
                  os.rename(data, asset)
                  subprocess.run(['gh', 'release', 'upload', 'files', asset, '--clobber'], check=True)
                  result = {'ok': True, 'url': f'https://github.com/{REPO}/releases/download/files/{file_name}', 'size': size, 'name': name}
                  if parts_dir:
                      shutil.rmtree(parts_dir, ignore_errors=True)
              except Exception as e:
                  result = {'ok': False, 'error': str(e)[:300]}
              print(rid, result)
              json.dump(result, open(f'migrate/results/{rid}.json', 'w', encoding='utf-8'), ensure_ascii=False)
              os.remove(path)
              shutil.rmtree(tmp, ignore_errors=True)
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import files into the release"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
